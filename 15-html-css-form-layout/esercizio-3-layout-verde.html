<html>
	<head>
		<title>titolo della pagina</title>
		
		<style>
		
		/* RESET */
		*{
			margin:0;
			padding:0;
			font-size:13px;
			font-family: Arial,sans-serif,'Times New Roman';
		}
		/* CONTENITORE GIALLO */
		.container{
			background-color: green;
			width: 900px;
			margin: 0  auto;
			padding: 10px;
		}
		/* CLASSSE GENERICA */
		.box{
			padding: 30px 0;
			border: 3px solid #3b2c0b;
			text-align: center;
			color: #FFFFFF;
			font-weight: bold;
			margin: 10px 0;
		}
		
		.unterzo{
			width: 291px;
		}
		
		.unmezzo{
			width: 444px;
		}
		
		.margin4{
			margin: 10px 4px;
		}
		
		.left{
			float:left;
		}
		
		/* CLASSE SPECIFICA PER SETTARE COLORE E PROPRIETA' DEI BOX */
		.verde{
			background-color: #344f47;
		}
		.arancio{
			background-color: #de6f07;
			text-decoration: underline;
		}
		.clear{
			clear:both;
		}
		</style>
		
	</head>
	<body>

		<div class="container">
			<div class="box left unterzo verde">Box 1</div>
			<div class="box left unterzo margin4 arancio">Box 2</div>
			<div class="box left unterzo verde">Box 3</div>
			<div class="clear"></div>
			<div class="box left unmezzo arancio">Box 4</div>
			<div class="box left unmezzo arancio">Box 5</div>
			<div class="clear"></div>
			<div class="box verde">Box 6</div>
			<div class="clear"></div>
			<div class="box arancio">Box 7</div>
			<div class="clear"></div>
		</div>
		
	</body>
</html>
