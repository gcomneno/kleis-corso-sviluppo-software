<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tema Bootswatch: Darkly -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.0.2/dist/darkly/bootstrap.min.css"
      rel="stylesheet"
    >

    <title>Bootstrap · Forms grid layout dark</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Forms · Grid layout</h1>
      <p class="mb-4">
        La grid Bootstrap può organizzare i campi del form in modo responsive.
      </p>

      <div class="card">
        <div class="card-body">
          <form>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control"
                  id="nome"
                  placeholder="Mario"
                >
              </div>

              <div class="col-12 col-md-6">
                <label for="cognome" class="form-label">Cognome</label>
                <input
                  type="text"
                  class="form-control"
                  id="cognome"
                  placeholder="Rossi"
                >
              </div>

              <div class="col-12 col-md-8">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="nome@example.com"
                >
              </div>

              <div class="col-12 col-md-4">
                <label for="ruolo" class="form-label">Ruolo</label>
                <select id="ruolo" class="form-select">
                  <option selected>Seleziona</option>
                  <option value="backend">Backend</option>
                  <option value="frontend">Frontend</option>
                  <option value="fullstack">Full stack</option>
                </select>
              </div>

              <div class="col-12">
                <label for="messaggio" class="form-label">Messaggio</label>
                <textarea
                  class="form-control"
                  id="messaggio"
                  rows="4"
                  placeholder="Scrivi qui il tuo messaggio"
                ></textarea>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-primary">
                  Invia richiesta
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
