<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Breakpoint columns</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Breakpoint columns</h1>
      <p class="mb-4">
        Le card cambiano disposizione in base alla larghezza della finestra.
      </p>

      <div class="row">
        <div class="col-12 col-md-6 col-lg-4 p-3 border">
          <h2>Card 1</h2>
          <p>Mobile: tutta riga. Medium: metà. Large: un terzo.</p>
        </div>

        <div class="col-12 col-md-6 col-lg-4 p-3 border">
          <h2>Card 2</h2>
          <p>Stesse classi, stesso comportamento responsive.</p>
        </div>

        <div class="col-12 col-md-6 col-lg-4 p-3 border">
          <h2>Card 3</h2>
          <p>Su schermo largo le tre card stanno sulla stessa riga.</p>
        </div>
      </div>
    </div>
  </body>
</html>
