<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Responsive grid</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Responsive grid</h1>
      <p class="mb-4">
        Su schermo piccolo le card stanno una sotto l'altra.
        Da schermo medio in su si affiancano.
      </p>

      <div class="row">
        <div class="col-12 col-md-6 p-3 border">
          <h2>Card 1</h2>
          <p>Questa card occupa tutta la riga su mobile e metà riga da md in su.</p>
        </div>

        <div class="col-12 col-md-6 p-3 border">
          <h2>Card 2</h2>
          <p>Anche questa cambia larghezza in base alla dimensione dello schermo.</p>
        </div>
      </div>
    </div>
  </body>
</html>
