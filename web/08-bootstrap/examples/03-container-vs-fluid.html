<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Container vs Container Fluid</title>
  </head>
  <body>
    <div class="container mt-4 p-3 border">
      <h1>Container normale</h1>
      <p>Questo blocco è centrato e ha una larghezza massima gestita da Bootstrap.</p>
      <button class="btn btn-primary">Bottone nel container</button>
    </div>

    <div class="container-fluid mt-4 p-3 border">
      <h1>Container fluid</h1>
      <p>Questo blocco occupa tutta la larghezza disponibile della finestra.</p>
      <button class="btn btn-success">Bottone nel container-fluid</button>
    </div>
  </body>
</html>
