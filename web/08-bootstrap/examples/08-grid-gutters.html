<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Grid gutters</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Grid gutters</h1>
      <p class="mb-4">
        La classe <code>g-3</code> aggiunge spazio tra le colonne e tra le righe.
      </p>

      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-3 border">
            <h2>Card 1</h2>
            <p>Questa card ha spazio intorno grazie al gutter della row.</p>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-3 border">
            <h2>Card 2</h2>
            <p>Nota che il bordo non si incolla al bordo dell'altra card.</p>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="p-3 border">
            <h2>Card 3</h2>
            <p>Il layout respira meglio, senza CSS custom.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
