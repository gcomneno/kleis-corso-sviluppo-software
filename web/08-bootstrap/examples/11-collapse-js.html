<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Collapse JS</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Bootstrap JavaScript</h1>
      <p class="mb-4">
        Alcuni componenti Bootstrap hanno bisogno del JavaScript per funzionare.
      </p>

      <button
        class="btn btn-primary mb-3"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#demoCollapse"
        aria-expanded="false"
        aria-controls="demoCollapse"
      >
        Apri / chiudi contenuto
      </button>

      <div class="collapse" id="demoCollapse">
        <div class="card card-body">
          Questo contenuto appare e scompare grazie al JavaScript di Bootstrap.
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
