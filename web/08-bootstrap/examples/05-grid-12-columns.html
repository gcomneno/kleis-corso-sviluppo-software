<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Grid 12 columns</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Grid a 12 colonne</h1>
      <p class="mb-4">Bootstrap divide idealmente ogni riga in 12 parti.</p>

      <div class="row mb-3">
        <div class="col-6 p-3 border">
          col-6
        </div>

        <div class="col-6 p-3 border">
          col-6
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-4 p-3 border">
          col-4
        </div>

        <div class="col-8 p-3 border">
          col-8
        </div>
      </div>

      <div class="row">
        <div class="col-3 p-3 border">
          col-3
        </div>

        <div class="col-3 p-3 border">
          col-3
        </div>

        <div class="col-3 p-3 border">
          col-3
        </div>

        <div class="col-3 p-3 border">
          col-3
        </div>
      </div>
    </div>
  </body>
</html>
