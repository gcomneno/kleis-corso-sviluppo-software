<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Cards base</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Card Bootstrap</h1>
      <p class="mb-4">
        Una card è un componente già pronto per raggruppare contenuti.
      </p>

      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title">Card 1</h2>
              <p class="card-text">Questa è una vera card Bootstrap.</p>
              <button class="btn btn-primary">Azione</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title">Card 2</h2>
              <p class="card-text">La struttura interna usa classi specifiche.</p>
              <button class="btn btn-success">Conferma</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title">Card 3</h2>
              <p class="card-text">Grid, gutter e componenti lavorano insieme.</p>
              <button class="btn btn-danger">Elimina</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
