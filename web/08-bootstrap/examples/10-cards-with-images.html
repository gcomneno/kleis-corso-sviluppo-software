<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >

    <title>Bootstrap · Cards con immagini</title>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Card con immagini</h1>
      <p class="mb-4">
        Una card può avere un'immagine sopra e contenuto testuale nel corpo.
      </p>

      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <img
              src="https://picsum.photos/600/300?random=1"
              class="card-img-top"
              alt="Immagine dimostrativa casuale"
            >
            <div class="card-body">
              <h2 class="card-title">Progetto 1</h2>
              <p class="card-text">Card con immagine superiore e corpo testuale.</p>
              <button class="btn btn-primary">Dettagli</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <img
              src="https://picsum.photos/600/300?random=2"
              class="card-img-top"
              alt="Immagine dimostrativa casuale"
            >
            <div class="card-body">
              <h2 class="card-title">Progetto 2</h2>
              <p class="card-text">La classe card-img-top integra l'immagine nella card.</p>
              <button class="btn btn-success">Apri</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="card">
            <img
              src="https://picsum.photos/600/300?random=3"
              class="card-img-top"
              alt="Immagine dimostrativa casuale"
            >
            <div class="card-body">
              <h2 class="card-title">Progetto 3</h2>
              <p class="card-text">Grid responsive, gutter e card lavorano insieme.</p>
              <button class="btn btn-danger">Rimuovi</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
