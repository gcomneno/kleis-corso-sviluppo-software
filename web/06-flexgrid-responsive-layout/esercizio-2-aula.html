<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Responsive</title>
  <link rel="stylesheet" href="style-esercizio-2-aula.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">LOGO</div>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#">Prodotti</a>
      <a href="#">Contatti</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Catalogo prodotti</h1>
    <p>Layout responsive con card e filtri laterali.</p>
  </section>

  <main class="page-layout">
    <section class="products">
      <article class="card">1</article>
      <article class="card">2</article>
      <article class="card">3</article>
      <article class="card">4</article>
      <article class="card">5</article>
      <article class="card">6</article>
    </section>

    <aside class="filters">
      <h2>Filtri</h2>
      <div class="filter-box">Categoria</div>
      <div class="filter-box">Prezzo</div>
      <div class="filter-box">Disponibilità</div>
    </aside>
  </main>

  <footer class="site-footer">
    FOOTER
  </footer>

</body>
</html>
