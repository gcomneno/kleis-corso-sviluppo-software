<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form di registrazione | Bootstrap Rewrite</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .registration-box {
      max-width: 640px;
    }

    .notes-area {
      min-height: 120px;
      resize: vertical;
    }

    .form-check-input {
      width: 1.4em;
      height: 1.4em;
    }
  </style>
</head>

<body>
  <main class="container py-5">
    <form class="registration-box mx-auto border border-2 border-primary bg-white p-4 needs-validation" novalidate>
      <h1 class="h4 fw-bold mb-4">FORM DI REGISTRAZIONE</h1>

      <div class="row align-items-center mb-3">
        <label for="nome" class="col-sm-4 col-form-label fs-5">Nome</label>
        <div class="col-sm-8">
          <input type="text" id="nome" name="nome"
                 class="form-control border border-2 border-secondary"
                 minlength="2"
                 required>
          <div class="invalid-feedback">
            Inserisci il nome.
          </div>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <label for="cognome" class="col-sm-4 col-form-label fs-5">Cognome</label>
        <div class="col-sm-8">
          <input type="text" id="cognome" name="cognome"
                 class="form-control border border-2 border-secondary"
                 minlength="2"
                 required>
          <div class="invalid-feedback">
            Inserisci il cognome.
          </div>
        </div>
      </div>

      <div class="row align-items-center mb-4">
        <label for="genere" class="col-sm-4 col-form-label fs-5">Genere</label>
        <div class="col-sm-8">
          <select id="genere" name="genere"
                  class="form-select border border-2 border-secondary"
                  required>
            <option value="" selected disabled>Seleziona</option>
            <option value="m">Maschio</option>
            <option value="f">Femmina</option>
            <option value="o">Altro</option>
          </select>
          <div class="invalid-feedback">
            Seleziona un genere.
          </div>
        </div>
      </div>

      <fieldset class="mb-3">
        <legend class="fs-5 mb-3">Registrazione per:</legend>

        <div class="form-check d-flex align-items-center gap-3 mb-3">
          <input type="radio" id="singolo" name="quantita" value="solo"
                 class="form-check-input"
                 required
                 checked>
          <label for="singolo" class="form-check-label fs-5">Singolo</label>
        </div>

        <div class="form-check d-flex align-items-center gap-3 mb-2">
          <input type="radio" id="gruppo" name="quantita" value="multi"
                 class="form-check-input">
          <label for="gruppo" class="form-check-label fs-5">Gruppo</label>
        </div>

        <div class="invalid-feedback">
          Seleziona il tipo di registrazione.
        </div>
      </fieldset>

      <div class="mb-3">
        <textarea id="note" name="note"
                  class="form-control border border-2 border-secondary notes-area text-center fs-5"
                  placeholder="Note"></textarea>
      </div>

      <div class="form-check d-flex align-items-center gap-3 mb-2">
        <input type="checkbox" id="privacy" name="privacy" value="Y"
               required
               class="form-check-input">
        <label for="privacy" class="form-check-label fs-5">Accettazione Privacy</label>

        <div class="invalid-feedback">
          Devi accettare la privacy.
        </div>
      </div>

      <p class="fs-5 mb-3">
        <a href="privacy.html" class="link-dark">Click per le condizioni di registrazione</a>
      </p>

      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <button type="reset" class="btn btn-primary w-100 fs-5">Reset Form</button>
        </div>

        <div class="col-12 col-sm-6">
          <button type="submit" class="btn btn-primary w-100 fs-5">Invia Registrazione</button>
        </div>
      </div>
    </form>
  </main>

  <script>
    (() => {
      "use strict";

      const forms = document.querySelectorAll(".needs-validation");

      Array.from(forms).forEach((form) => {
        form.addEventListener("submit", (event) => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }

          form.classList.add("was-validated");
        }, false);
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
