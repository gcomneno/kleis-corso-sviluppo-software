<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Cambio Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cambio Password</h1>

    <form>

        <label for="new-password">
            Nuova password
        </label>

        <input
            type="password"
            id="new-password"
            name="new-password"
        >

        <br><br>

        <label for="confirm-password">
            Conferma password
        </label>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
        >

        <br><br>

        <button type="submit">
            Cambia password
        </button>

    </form>

</body>
</html>
