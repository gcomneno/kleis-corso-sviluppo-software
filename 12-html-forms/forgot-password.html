<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Recupero Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Recupero Password</h1>

    <form>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="nome@dominio.it"
        >

        <br><br>

        <button type="submit">
            Recupera password
        </button>

    </form>

</body>
</html>
